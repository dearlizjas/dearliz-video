<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拍照前，你是哪一種爸媽？｜Dear Liz</title>
<meta name="description" content="5 題 30 秒，測出你的拍照性格。">
<meta property="og:title" content="拍照前，你是哪一種爸媽？🤍">
<meta property="og:description" content="5 題 30 秒，測出你的拍照性格。">
<meta property="og:image" content="https://dearlizjas.github.io/dearliz-video/quiz/photos/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ec;--ink:#2f2d2a;--muted:#8b8680;--line:#d6cfc4;--accent:#9a8571;
  --serif:"Noto Serif TC","Songti TC",serif;--en:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--serif);font-weight:300;line-height:1.9;font-size:15.5px;letter-spacing:.04em}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.wrap{width:min(420px,100% - 48px);margin-inline:auto;padding:28px 0 30px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--ink);font-family:var(--en);font-size:13px;letter-spacing:.28em}
.top i{font-style:italic;letter-spacing:.08em;color:var(--muted)}
.screen{display:none}
.screen.on{display:block;animation:in .7s ease}
@keyframes in{from{opacity:0}to{opacity:1}}

/* 首頁 */
.mat{position:relative;background:#fbf9f5;padding:12px;box-shadow:0 1px 2px rgba(60,50,40,.08),0 22px 40px -30px rgba(60,50,40,.45)}
.mat::after{content:"";position:absolute;inset:5px;border:1px solid var(--line);pointer-events:none}
.mat .ph{position:relative;overflow:hidden;aspect-ratio:2/3}
.mat .ph img{transform:scale(1.06);opacity:0;transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1s ease}
.screen.on .mat .ph img.ready{transform:none;opacity:1}
.mat .cap{display:flex;justify-content:space-between;margin:10px 2px 0;font-family:var(--en);font-style:italic;font-size:13px;color:var(--muted);letter-spacing:.06em}
.cover .mat{margin:28px 0 0}
.cover .mat .ph{aspect-ratio:3/4}
.cover .en{margin:26px 0 0;font-family:var(--en);font-style:italic;font-size:17px;color:var(--muted);letter-spacing:.04em}
.cover h1{margin:6px 0 0;font-weight:500;font-size:clamp(25px,7.4vw,30px);line-height:1.6;letter-spacing:.12em}
.cover .sub{margin:12px 0 0;font-size:13.5px;color:var(--muted);letter-spacing:.14em}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;margin:30px 0 0;padding:0 20px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font-size:15px;font-weight:400;letter-spacing:.24em;text-decoration:none;transition:background .3s,color .3s}
.btn::after{content:"→";font-family:var(--en);letter-spacing:0}
.btn:hover,.btn:active{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.ghost{margin-top:12px;border-color:var(--line);color:var(--muted)}
.btn.ghost::after{content:""}

/* 題目 */
.qno{margin:34px 0 0;font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--muted)}
.qno b{font-weight:500;font-size:22px;color:var(--ink)}
.bar{height:1px;margin:10px 0 0;background:var(--line)}
.bar i{display:block;height:1px;background:var(--ink);transition:width .5s}
.q h2{margin:30px 0 26px;font-size:19px;font-weight:500;line-height:1.75;letter-spacing:.08em}
.opt{display:flex;gap:16px;align-items:baseline;width:100%;padding:16px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15.5px;font-weight:300;line-height:1.7;letter-spacing:.06em;transition:background .25s,padding .25s}
.opt:last-child{border-bottom:1px solid var(--line)}
.opt b{flex:none;font-family:var(--en);font-style:italic;font-weight:400;font-size:17px;color:var(--muted)}
.opt:active,.opt.pick{background:#ebe6de;padding-left:12px}
.back{display:block;margin:18px 0 0;border:0;background:none;color:var(--muted);font-size:13px;letter-spacing:.14em}

/* 結果 */
.res .label{margin:34px 0 0;font-size:13px;color:var(--muted);letter-spacing:.24em}
.res h2{margin:6px 0 0;font-size:clamp(21px,6.2vw,25px);font-weight:500;line-height:1.6;letter-spacing:.1em}
.res .en{display:block;font-family:var(--en);font-style:italic;font-size:16px;color:var(--muted)}
.res .mat{width:70%;margin:28px auto 0}
.res .desc{margin:26px 0 0;font-size:15.5px;line-height:2.1}
.res .care{margin:22px 0 0;padding:18px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:500;line-height:2;letter-spacing:.08em}
.res .ease{margin:22px 0 0;font-size:13.5px;line-height:2.1;color:var(--muted)}
.again{display:block;margin:20px auto 0;border:0;background:none;color:var(--muted);font-size:13px;letter-spacing:.14em;text-decoration:underline;text-underline-offset:5px}
.music{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:rgba(244,241,236,.92);color:var(--ink);font-family:var(--en);font-size:17px;line-height:1;display:grid;place-items:center;transition:opacity .3s}
.music.off{opacity:.5}
.music.off::after{content:"";position:absolute;width:22px;height:1px;background:var(--ink);transform:rotate(-45deg)}
.music.on span{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
footer{text-align:center;padding:10px 0 calc(28px + env(safe-area-inset-bottom));font-family:var(--en);font-size:12px;letter-spacing:.24em;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>DEAR LIZ</span><i>a little test</i></div>

  <!-- 首頁 -->
  <section class="screen cover on" id="cover">
    <div class="mat"><div class="ph"><img src="photos/cover.jpg" alt="親子寫真作品"></div><div class="cap"><span>Dear Liz</span><span>family, always</span></div></div>
    <p class="en">Which parent are you, before the photo?</p>
    <h1>拍照前，<br>你是哪一種爸媽？</h1>
    <p class="sub">五個問題，三十秒。</p>
    <button class="btn solid" id="start">開始</button>
  </section>

  <!-- 題目 -->
  <section class="screen q" id="quiz">
    <div class="qno" id="qno"></div>
    <div class="bar"><i id="fill"></i></div>
    <h2 id="qtext"></h2>
    <div id="opts"></div>
    <button class="back" id="back">← 上一題</button>
  </section>

  <!-- 結果 -->
  <section class="screen res" id="result">
    <div class="label">你是</div>
    <h2 id="rName"></h2>
    <span class="en" id="rEn"></span>
    <div class="mat"><div class="ph"><img id="rImg" src="" alt=""></div><div class="cap"><span id="rNo"></span><span id="rHand"></span></div></div>
    <p class="desc" id="rDesc"></p>
    <p class="care" id="rCare"></p>
    <p class="ease">服裝、妝髮、風格規劃和寶寶的安撫，<br>都有我們一起準備。<br>你只要帶著家人來，好好享受拍照的時間。</p>
    <a class="btn solid" id="bookBtn" href="#" target="_blank" rel="noopener">預約諮詢</a>
    <button class="btn ghost" id="shareBtn">分享給朋友測測看</button>
    <button class="again" id="again">再測一次</button>
  </section>
</div>
<button class="music off" id="music" aria-label="背景音樂開關"><span>♪</span></button>
<footer>DEAR LIZ · 親愛的莉絲</footer>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var c = document.querySelector('.cover .ph img');
  function on(){ c.classList.add('ready'); }
  if (c.complete) setTimeout(on, 60); else c.addEventListener('load', on);
});
var BOOKING_URL = 'https:' + '/' + '/dearlizzlink.pse.is/9pft33';
document.getElementById('bookBtn').href = BOOKING_URL;

var QS = [
  {q:'決定要拍全家福，你第一個想到的是？', o:['大家要穿什麼才好看？','寶寶到時候會不會哭？','我要先整理好自己','想拍很久了，但一直沒時間']},
  {q:'出門前，最花你時間的是？', o:['挑衣服，換了又換','幫孩子打包東西','整理自己的樣子','一直在等大家準備好']},
  {q:'翻到以前的照片，你最常想？', o:['那時候穿這樣好可愛','那時候他好小，好想再抱一次','怎麼都是我在拍，我都不在照片裡','那時候怎麼沒多拍一點']},
  {q:'拍照當天，你最希望？', o:['有人幫我搭好全家的衣服','有人幫我顧好寶寶','有人幫我打理好自己','不要想太多，好好享受就好']},
  {q:'用一句話形容現在的你？', o:['喜歡把生活過得好看一點','心都在孩子身上','好久沒有好好照顧自己了','每天都好忙，日子過得好快']}
];
var RES = [
  {en:'The Aesthete', name:'細節滿分的美感媽媽', img:'photos/a.jpg', hand:'every detail ♡',
   desc:'你對每個畫面都有想法，<br>只是要一個人全部顧好，真的很累。',
   care:'服裝挑選和拍攝風格，<br>我們會陪你一起規劃。'},
  {en:'The Guardian', name:'心都在孩子身上的守護媽媽', img:'photos/b.jpg', hand:'my little one ♡',
   desc:'你最在意的，<br>是寶寶能不能自在、開心。',
   care:'拍攝時有專人在旁安撫和協助，<br>你可以放心待在鏡頭裡。'},
  {en:'The Gentle One', name:'總是忘了自己的溫柔媽媽', img:'photos/c.jpg', hand:'this is me ♡',
   desc:'你把時間都給了家人，<br>常常忘了自己也該被好好記錄。',
   care:'這一天，妝髮交給我們，<br>換你被好好拍下來。'},
  {en:'The Busy Ones', name:'時間總是不夠的忙碌爸媽', img:'photos/d.jpg', hand:'all of us ♡',
   desc:'一直想拍，卻一直「等有空再說」，<br>孩子卻已經又長大了一點。',
   care:'拍照前的準備都交給我們，<br>你只要帶著家人來就好。'}
];

var ans = [], cur = 0;
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('on', s.id === id); });
  window.scrollTo(0, 0);
}
function renderQ(){
  document.getElementById('fill').style.width = ((cur + 1) / QS.length * 100) + '%';
  document.getElementById('qno').innerHTML = '<b>0' + (cur + 1) + '</b> / 0' + QS.length;
  document.getElementById('qtext').textContent = QS[cur].q;
  var box = document.getElementById('opts'); box.innerHTML = '';
  QS[cur].o.forEach(function(t, k){
    var b = document.createElement('button');
    b.className = 'opt' + (ans[cur] === k ? ' pick' : '');
    b.innerHTML = '<b>' + 'abcd'[k] + '.</b><span></span>';
    b.querySelector('span').textContent = t;
    b.addEventListener('click', function(){
      ans[cur] = k; b.classList.add('pick');
      setTimeout(function(){
        if (cur < QS.length - 1) { cur++; renderQ(); show('quiz'); }
        else result();
      }, 260);
    });
    box.appendChild(b);
  });
  document.getElementById('back').style.visibility = cur ? 'visible' : 'hidden';
}
function result(){
  var n = [0, 0, 0, 0];
  ans.forEach(function(k){ n[k]++; });
  var max = Math.max.apply(null, n), r = ans[QS.length - 1];
  if (n[r] !== max) r = n.indexOf(max);
  var R = RES[r];
  document.getElementById('rEn').textContent = R.en;
  document.getElementById('rName').textContent = R.name;
  document.getElementById('rImg').src = R.img;
  document.getElementById('rImg').alt = R.name;
  document.getElementById('rDesc').innerHTML = R.desc;
  document.getElementById('rCare').innerHTML = R.care;
  document.getElementById('rHand').textContent = R.hand;
  document.getElementById('rNo').textContent = 'No.0' + (r + 1);
  var im = document.getElementById('rImg'); im.classList.remove('ready'); setTimeout(function(){ im.classList.add('ready'); }, 60);
  document.getElementById('shareBtn').dataset.name = R.name;
  show('result');
}
document.getElementById('start').addEventListener('click', function(){ if (!musicTouched) musicOn(); ans = []; cur = 0; renderQ(); show('quiz'); });
document.getElementById('back').addEventListener('click', function(){ if (cur) { cur--; renderQ(); } });
document.getElementById('again').addEventListener('click', function(){ show('cover'); var c=document.querySelector('.cover .ph img'); c.classList.remove('ready'); setTimeout(function(){ c.classList.add('ready'); }, 60); });
document.getElementById('shareBtn').addEventListener('click', function(){
  var url = location.href.split('#')[0].split('?')[0];
  var text = '我測出來是「' + this.dataset.name + '」🤍\n拍照前，你是哪一種爸媽？30 秒測測看：\n' + url;
  if (navigator.share) { navigator.share({title:'拍照前，你是哪一種爸媽？', text:text}).catch(function(){}); }
  else { location.href = 'https:' + '/' + '/line.me/R/share?text=' + encodeURIComponent(text); }
});

/* 輕音樂：網頁自己產生的音樂盒旋律（不用音樂檔） */
var AC, master, playing = false, musicTouched = false, nextT = 0, step = 0, timer;
var SEQ = [[60,64,67,72,76,72,67,64],[57,60,64,69,72,69,64,60],[53,57,60,65,69,65,60,57],[55,59,62,67,71,67,62,59]];
var STEP = 0.46;
function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function initAudio(){
  var C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
  AC = new C();
  master = AC.createGain(); master.gain.value = 0;
  var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  var dl = AC.createDelay(); dl.delayTime.value = 0.36;
  var fb = AC.createGain(); fb.gain.value = 0.3;
  var wet = AC.createGain(); wet.gain.value = 0.3;
  master.connect(lp); lp.connect(AC.destination);
  lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(AC.destination);
  return true;
}
function note(m, t, vol, len){
  var g = AC.createGain(), o = AC.createOscillator(), o2 = AC.createOscillator(), g2 = AC.createGain();
  o.type = 'sine'; o.frequency.value = hz(m);
  o2.type = 'triangle'; o2.frequency.value = hz(m) * 2; g2.gain.value = 0.12;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
}
function tick(){
  while (nextT < AC.currentTime + 0.35) {
    var bar = Math.floor(step / 8) % SEQ.length, i = step % 8;
    note(SEQ[bar][i], nextT, 0.32, 2.2);
    if (i === 0) note(SEQ[bar][0] - 12, nextT, 0.22, 3.4);
    nextT += STEP; step++;
  }
}
function musicOn(){
  if (!AC && !initAudio()) return;
  if (AC.state === 'suspended') AC.resume();
  if (!playing) { playing = true; nextT = AC.currentTime + 0.1; timer = setInterval(tick, 100); }
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.setTargetAtTime(0.13, AC.currentTime, 0.8);
  var b = document.getElementById('music'); b.classList.remove('off'); b.classList.add('on');
}
function musicOff(){
  var b = document.getElementById('music'); b.classList.add('off'); b.classList.remove('on');
  if (!AC) return;
  master.gain.setTargetAtTime(0, AC.currentTime, 0.3);
  setTimeout(function(){ if (b.classList.contains('off')) { clearInterval(timer); playing = false; } }, 1200);
}
document.getElementById('music').addEventListener('click', function(){
  musicTouched = true;
  if (this.classList.contains('off')) musicOn(); else musicOff();
});
document.addEventListener('visibilitychange', function(){
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (playing) AC.resume();
});
</script>
</body>
</html>
